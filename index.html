<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Lost World: Project Zero</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b1410;--fg:#e8f3e0;--ac:#f5b942;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.u{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000}
#hud{top:8px;left:10px;max-width:46vw}
.bar{height:8px;background:#0008;border-radius:4px;overflow:hidden;margin:3px 0;width:150px}.bar i{display:block;height:100%;background:#d94b3d;width:100%}
#cmp{top:4px;right:8px;font-weight:700;text-align:right}#cmp canvas{position:static;inset:auto;width:88px;height:88px;margin:0 0 0 auto;display:block}#ct{font-size:13px;line-height:15px}#cv{font-size:11px;font-weight:600;color:#9be39b;line-height:13px;white-space:pre}
#tm{top:140px;right:10px;text-align:right;max-width:42vw}
#tm .bar i{background:#6fd16f}
#boss{top:118px;left:50%;transform:translateX(-50%);width:50vw;display:none;text-align:center}#boss .bar{width:100%;height:12px}#boss i{background:#9a3df0}
#toast{z-index:11;top:30%;left:50%;transform:translateX(-50%);background:#000a;padding:8px 14px;border-radius:8px;text-align:center;max-width:70vw;display:none}
#red{inset:0;background:#f00;opacity:0;transition:opacity .3s}
#js{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #fff4;touch-action:none}
#kn{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fff6}
#bt{position:fixed;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(3,62px);gap:6px}
.b{height:44px;border-radius:10px;background:#1c2e22cc;border:1px solid #fff4;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.1;touch-action:none;cursor:pointer}
.b.big{background:#a63b2fcc;height:56px;grid-column:span 1}
.ov{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;text-align:center;padding:16px;overflow:auto}
.ov h1{margin:0;font-size:clamp(20px,5vw,38px);letter-spacing:1px;color:var(--ac)}
.btn{padding:10px 20px;border-radius:10px;background:var(--ac);color:#222;font-weight:700;cursor:pointer}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#1c2e22;border-radius:10px;padding:8px 12px;width:min(440px,90vw);text-align:left}
.it small{opacity:.7;display:block}
#pl{position:fixed;top:16%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .6s;z-index:10;pointer-events:none;text-shadow:0 2px 6px #000}#pl small{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.85}#pl b{font-size:clamp(18px,4.5vw,30px);letter-spacing:1px;color:#ffe9a8}
#hb{position:fixed;left:50%;bottom:128px;transform:translateX(-50%);display:flex;gap:3px;z-index:3;touch-action:none}.hs{position:relative;width:clamp(26px,4vw,38px);height:clamp(26px,4vw,38px);border-radius:6px;background:#10201acc;border:2px solid #fff3;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.4vw,19px);cursor:pointer}.hs.on{border-color:#f5b942;background:#3a3a1acc;box-shadow:0 0 8px #f5b94299}.hs.z{opacity:.4}.hs i{position:absolute;left:2px;top:0;font-size:9px;font-style:normal;opacity:.85}.hs b{position:absolute;right:2px;bottom:0;font-size:10px}
#xh{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #0009,0 0 6px #fff8;opacity:.8;pointer-events:none;display:none;z-index:2}
#camlbl{position:fixed;top:58px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:14px;background:#000b;border:1px solid #fff3;font-size:13px;font-weight:700;letter-spacing:.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:12;white-space:nowrap}
